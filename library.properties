name=Voltino BMP580
version=1.2.0
author=Tomas Michal
maintainer=Tomas Michal
sentence=Optimized Arduino library for the Bosch BMP580 pressure and temperature sensor (I2C) with smart caching, IIR filter, FORCED mode, FIFO and interrupts.
paragraph=Memory-efficient library following the Bosch BMP580 datasheet (BST-BMP580-DS004). Features smart I2C caching, automatic address fallback (0x46/0x47), soft reset with power-up checks, NORMAL/FORCED/CONTINUOUS modes, hardware IIR filter, OSR/ODR validity check, FIFO buffer, data-ready and pressure out-of-range interrupts, deep standby and NVM unique ID. Works on AVR (Uno), ESP32, RP2040/RP2350 and other Arduino cores.
category=Sensors
